name: Build Arkovia OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "scripts/build-iso.sh"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: arkovia-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debian live-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate repository
        run: ./scripts/validate.sh

      - name: Build ISO in Debian Trixie
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -lc 'apt-get update && apt-get install -y --no-install-recommends live-build xorriso ca-certificates && ./scripts/build-iso.sh'

      - name: Display output
        run: |
          ls -lh build/*.iso build/*.sha256
          cd build
          sha256sum --check *.sha256

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: arkovia-os-developer-preview-amd64
          path: |
            build/*.iso
            build/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
